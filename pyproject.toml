[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teled"
version = "1.0.0"
description = "A modern LazyGit-inspired TUI downloader for Telegram Saved Messages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TeleD Developers", email = "info@teled.dev" }
]
dependencies = [
    "telethon>=1.34.0",
    "textual>=0.50.0",
    "rich>=13.7.0",
    "rapidfuzz>=3.6.0",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
teled = "tgdl.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tgdl*"]
